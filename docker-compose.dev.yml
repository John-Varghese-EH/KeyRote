version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: keyrote_redis_dev
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped

volumes:
  redis_data_dev:
